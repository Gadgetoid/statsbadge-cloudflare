[project]
name = "statsbadge-cloudflare"
dynamic = ["version"]
description = "Cloudflare web traffic as statsbadge readings, a group per domain"
readme = "README.md"
authors = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
license = "MIT"
requires-python = ">=3.11"
dependencies = ["statsbadge>=1.1.0"]

[project.urls]
Homepage = "https://github.com/pimoroni/statsbadge-cloudflare"
Repository = "https://github.com/pimoroni/statsbadge-cloudflare"
Issues = "https://github.com/pimoroni/statsbadge-cloudflare/issues"

# The whole extension mechanism is this one entry point:
[project.entry-points."statsbadge.sources"]
cloudflare = "statsbadge_cloudflare:Cloudflare"

# The tag is the version.
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/statsbadge_cloudflare"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

name: Publish

# Trusted publishing, so PyPI trusts this workflow over OIDC and no API token is stored
# here. Configure it once at pypi.org/manage/project/statsbadge-cloudflare/settings/publishing/
# with this repository, this filename and the `pypi` environment. The build is
# statsbadge's; the publish has to stay here, since PyPI trusts a file by name.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: pimoroni/statsbadge/.github/workflows/extension-build.yml@main

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # for trusted publishing

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # setup-uv publishes exact versions only, no major tag
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"

      - run: uv publish --trusted-publishing always dist/*
